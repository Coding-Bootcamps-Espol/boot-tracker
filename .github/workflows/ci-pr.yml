name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# GHCR exige el namespace en minúsculas, por eso no sale de github.repository_owner.
env:
  IMAGE_NS: ghcr.io/coding-bootcamps-espol

jobs:
  backend-ci:
    name: Backend — Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for docker compose
        run: |
          cat <<EOF > .env
          SECRET_KEY=ci-secret-key-not-for-production
          DEBUG=True
          DB_NAME=boottracker_test
          DB_USER=boottracker
          DB_PASSWORD=boottracker123
          DB_HOST=db
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/0
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for backend — run Django system check
        run: docker compose exec -T backend python manage.py check

      # Detecta cambios en modelos sin su migración: si falta, el deploy
      # arranca contra un esquema que no coincide con el código.
      - name: Check for missing migrations
        run: docker compose exec -T backend python manage.py makemigrations --check --dry-run

      # Umbral real, no aspiracional: la corrida del 2026-08-11 midió 87% sobre
      # apps/ (ver docs/testing/test-run-2026-08-11.txt). 85% deja margen para
      # fluctuación normal sin dejar de ser un gate significativo.
      - name: Run tests with coverage
        run: docker compose exec -T backend pytest --tb=short -q --cov=apps --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Copy coverage report out of the container
        if: always()
        run: docker compose cp backend:/app/coverage.xml backend/coverage.xml || true

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

      - name: Run linter
        run: docker compose exec -T backend python -m ruff check . --select E,F,W --ignore E501

      # Bloqueante desde el hardening de S6: con continue-on-error, los
      # hallazgos de seguridad se registraban y nadie los veía.
      - name: Security scan (bandit)
        run: docker compose exec -T backend bandit -r apps/ -ll

      - name: Type check (mypy)
        continue-on-error: true
        run: docker compose exec -T backend mypy apps/ --ignore-missing-imports

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend-ci:
    name: Frontend — Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint

      - name: Build check
        working-directory: frontend
        run: npm run build

      # El umbral vive en vite.config.js (test.coverage.thresholds) para que
      # `npm run test -- --coverage` en local se comporte igual que en CI.
      - name: Run tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  mobile-ci:
    name: Mobile — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Run linter
        working-directory: mobile
        run: npm run lint

      - name: Run tests
        working-directory: mobile
        run: npm run test -- --passWithNoTests

  # Pruebas de aceptación (Given/When/Then por HST) contra la stack completa.
  #
  # Levanta su propia stack en vez de colgarse de backend-ci: ese job hace
  # `down -v` al terminar y mezclar ambos haría que un fallo de aceptación se
  # lea como un fallo de backend en la lista de checks.
  #
  # A propósito NO figura en el `needs:` de build-push: un E2E inestable no
  # puede bloquear despliegues en semana de entrega. Se vuelve check requerido
  # recién tras ~10 corridas verdes seguidas.
  e2e-ci:
    name: E2E — Pruebas de aceptación (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for docker compose
        run: |
          cat <<EOF > .env
          SECRET_KEY=ci-secret-key-not-for-production
          DEBUG=True
          DB_NAME=boottracker_test
          DB_USER=boottracker
          DB_PASSWORD=boottracker123
          DB_HOST=db
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/0
          FRONTEND_URL=http://localhost:5173
          AUTH_THROTTLE_RATE=100/min
          EOF
        # Los emails no salen a la red: manage.py usa config.settings.local por
        # defecto y ese módulo fija el backend de consola.
        # AUTH_THROTTLE_RATE sube el límite de 5/min del login solo en este
        # entorno: la suite hace muchos logins legítimos desde una sola IP.

      - name: Build and start services
        run: docker compose up -d --build db redis backend celery frontend

      # Tres compuertas explícitas, sin sleeps ciegos.
      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T backend python manage.py check >/dev/null 2>&1; then
              echo "backend listo"; exit 0
            fi
            sleep 2
          done
          echo "El backend no arrancó a tiempo:"; docker compose logs backend; exit 1

      - name: Migrate and seed
        run: |
          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T backend python manage.py seed_dev

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then echo "frontend listo"; exit 0; fi
            sleep 2
          done
          echo "El frontend no respondió a tiempo:"; docker compose logs frontend; exit 1

      # Sin un worker consumiendo, la subida del comprobante agota el
      # presupuesto de OCR y el escenario de pagos falla por entorno, no por código.
      - name: Wait for Celery worker
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T celery celery -A config.celery_app inspect ping >/dev/null 2>&1; then
              echo "celery listo"; exit 0
            fi
            sleep 2
          done
          echo "El worker de Celery no respondió a tiempo:"; docker compose logs celery; exit 1

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run acceptance tests
        working-directory: e2e
        run: npm test
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/reports/
          retention-days: 14

      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color backend celery frontend > e2e-service-logs.txt || true

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: e2e-service-logs.txt
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Construir y publicar está separado de desplegar a propósito: el primer arranque en el
  # servidor se hace a mano (Fase 4) y necesita las imágenes en GHCR antes de que exista
  # ningún automatismo. Si estuvieran en el mismo job, para tener imágenes habría que
  # encender el deploy, y ese es justo el orden que no queremos.
  build-push:
    name: Construir y publicar imágenes (GHCR)
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Los builds corren acá y no en el VPS: la caja tiene 2 vCPU y 3.7 GiB
      # compartidos con otra aplicación en producción.
      #
      # El tag del SHA se publica siempre; `latest`, sólo desde main, y `staging`, sólo
      # desde staging. Así una rama nunca puede mover el tag móvil de la otra y el
      # "sólo main llega a producción" sigue en pie.
      # El tag del SHA es además lo que hace posible el rollback: deploy.sh <sha-anterior>.
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/boot-tracker-backend:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/boot-tracker-backend:latest', env.IMAGE_NS) || '' }}
            ${{ github.ref == 'refs/heads/staging' && format('{0}/boot-tracker-backend:staging', env.IMAGE_NS) || '' }}
          # El deploy.sh del servidor limpia imágenes viejas filtrando por esta label.
          # Sin ella, el prune no tendría con qué distinguirlas de las de la otra app.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/boot-tracker-frontend:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/boot-tracker-frontend:latest', env.IMAGE_NS) || '' }}
            ${{ github.ref == 'refs/heads/staging' && format('{0}/boot-tracker-frontend:staging', env.IMAGE_NS) || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "### Imágenes publicadas" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE_NS }}/boot-tracker-backend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE_NS }}/boot-tracker-frontend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy a producción (VPS Hetzner)
    needs: [build-push]
    # Sólo main, sólo en push (no en PRs), y sólo si el despliegue está habilitado.
    # DEPLOY_ENABLED es una variable de repositorio (Settings → Variables). Mientras no
    # exista o no valga 'true', este job se salta: así se puede mergear sin que falle
    # antes de que el servidor y los secrets estén listos.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # El environment `production` sólo acepta la rama main (Settings → Environments), y
    # la llave de deploy vive ahí: un workflow modificado en otra rama no puede leerla.
    environment: production

    steps:
      # La llave está restringida en authorized_keys con
      #   command="/opt/boot-tracker/deploy.sh",no-port-forwarding,no-agent-forwarding,no-pty
      # así que sólo puede ejecutar el despliegue: si el secret se filtrara, no abre shell.
      #
      # Se manda ÚNICAMENTE el SHA, no una línea de comando: con un `command=` forzado,
      # lo que se envía llega al servidor en $SSH_ORIGINAL_COMMAND, y el script lo lee de
      # ahí y lo valida contra ^[0-9a-f]{40}$ antes de usarlo.
      - name: Desplegar en el VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: ${{ github.sha }}

  deploy-staging:
    name: Deploy a staging (VPS Hetzner)
    needs: [build-push]
    # Mismo patrón que producción, con su propia llave y su propia variable de encendido.
    # La llave de staging está restringida a command="/opt/boot-tracker-staging/deploy.sh":
    # aunque el secret se filtre, no puede tocar producción.
    if: >-
      github.ref == 'refs/heads/staging' &&
      github.event_name == 'push' &&
      vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Desplegar en el VPS (staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          script: ${{ github.sha }}
